name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Thu 03:00 UTC = Wed 11pm ET / 8pm PT
    - cron: "0 3 * * 4"
  workflow_dispatch:  

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Falls back to the committed snapshot if themes.rockbox.org can't be reached.
      - name: Refresh theme data from themes.rockbox.org
        run: npm run data:update
        continue-on-error: true
        timeout-minutes: 15

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
